name = "cutetopop-worker"
main = "src/index.js"
compatibility_date = "2025-09-06"

# Routing: cutetopop.com is the only public entry point; www redirects to it
# (see the top of fetch in src/index.js). Cloudflare Access protects /admin on
# cutetopop.com only, so no wildcard subdomain route, workers.dev URL, or
# preview URLs. Wrangler cannot delete plain routes created in the dashboard:
# remove those there.
workers_dev = false
preview_urls = false
routes = [
  { pattern = "cutetopop.com", custom_domain = true },
  { pattern = "www.cutetopop.com", custom_domain = true }
]

# Cloudflare Access application checked by src/lib/access.js on admin requests.
# Public identifiers, not secrets. For wrangler dev, put ACCESS_DEV_BYPASS = "true"
# in .dev.vars (never here).
[vars]
ACCESS_TEAM_DOMAIN = "kageki.cloudflareaccess.com"
ACCESS_AUD = "9e138c3ea8063b9fb7e528165d294ebf879e99442638fd0893bb2b7dee6670ff"

# Static assets directory
[assets]
directory = "./public"

# Observability configuration - from your recent commit
[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1

# Smart Placement for optimal worker execution location
[placement]
mode = "smart"

# D1 Database binding
# Allows worker to access database via env.DB
[[d1_databases]]
binding = "DB"
database_name = "cutetopop-db"
database_id = "f9d232d7-69ed-4e19-8238-9970badd54d6"
migrations_dir = "migrations"


# KV Namespace for caching images list
[[kv_namespaces]]
binding = "IMAGES_CACHE"
id = "b3a4366fb67e42ccbdeaa92d0f2cb376"
preview_id = "112191adc1ea4acb85f38d80370200f8"

# R2 Bucket for image storage
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "cutetopop-images"
preview_bucket_name = "cutetopop-images-preview"

# Cron Triggers for scheduled tasks
# Daily KV cache sync at 3 AM UTC
[triggers]
crons = ["0 3 * * *"]
